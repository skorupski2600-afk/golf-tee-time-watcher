name: Check Golf Tee Times

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore alert history
        uses: actions/cache/restore@v4
        with:
          path: seen-alerts.json
          key: golf-alert-history-${{ github.run_id }}
          restore-keys: |
            golf-alert-history-

      - name: Check tee times
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node watcher.js

      - name: Save alert history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen-alerts.json
          key: golf-alert-history-${{ github.run_id }}

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golf-check-results
          path: |
            results.json
            seen-alerts.json
            *.png
            *.txt
          retention-days: 7
